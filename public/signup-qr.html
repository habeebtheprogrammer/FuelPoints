<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birdies Loyalty - Signup QR Code</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 15px;
      border-radius: 12px;
    }
    h1 {
      color: #1E3A8A;
      font-size: 28px;
      margin-bottom: 8px;
    }
    .tagline {
      color: #64748B;
      font-size: 16px;
      margin-bottom: 30px;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    #qrcode img {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .url {
      background: #F1F5F9;
      padding: 12px 20px;
      border-radius: 8px;
      color: #1E3A8A;
      font-weight: 600;
      font-size: 14px;
      word-break: break-all;
      margin-bottom: 20px;
    }
    .instructions {
      color: #64748B;
      font-size: 14px;
      line-height: 1.6;
    }
    .instructions strong {
      color: #1E3A8A;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/assets/birdies-logo.jpg" alt="Birdies Logo" class="logo">
    <h1>Birdies Loyalty</h1>
    <p class="tagline">Scan to Sign Up & Earn Rewards</p>
    
    <div id="qrcode"></div>
    
    <div class="url">https://birdiesloyalty.com/signup</div>
    
    <p class="instructions">
      <strong>Scan with your phone camera</strong><br>
      to create your loyalty account and start earning FREE rewards!
    </p>
  </div>

  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: "https://birdiesloyalty.com/signup",
      width: 200,
      height: 200,
      colorDark: "#1E3A8A",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
